# Runs the official WordPress Plugin Check (what WordPress.org reviewers use)
# against the plugin on a real WordPress install.
name: Plugin Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the plugin as it is released
        run: |
          mkdir -p dist
          unzip -q "$(bin/build-zip.sh HEAD dist)" -d dist

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/brew-log-for-brewfather
