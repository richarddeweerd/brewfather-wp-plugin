stages:
  - test

.composer:
  # Needs a Docker executor; the untagged runner is shell-only.
  tags:
    - docker
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress
  cache:
    key: composer-$CI_JOB_NAME
    paths:
      - vendor/

# Syntax check on the oldest and newest supported PHP. Plain `php -l` with no
# Composer, because the php:7.4 image's Debian mirrors are gone (no apt-get).
lint:
  stage: test
  tags:
    - docker
  image: php:${PHP_VERSION}-cli
  parallel:
    matrix:
      - PHP_VERSION: ["7.4", "8.3"]
  script:
    - find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

# WordPress coding standards and PHP 7.4+ compatibility.
phpcs:
  extends: .composer
  stage: test
  image: php:8.3-cli
  script:
    - composer phpcs
