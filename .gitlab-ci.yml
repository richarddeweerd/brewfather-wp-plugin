stages:
  - test
  - publish

.composer:
  # Needs a Docker executor; the untagged runner is shell-only.
  tags:
    - docker
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    # GitHub sometimes answers zip downloads from the runner with 504s; fall
    # back to cloning the packages with git.
    - composer install --no-interaction --no-progress || composer install --no-interaction --no-progress --prefer-source
  cache:
    key: composer
    paths:
      - .composer-cache/

# Syntax check on the oldest and newest supported PHP. Plain `php -l` with no
# Composer, because the php:7.4 image's Debian mirrors are gone (no apt-get).
lint:
  stage: test
  tags:
    - docker
  image: php:${PHP_VERSION}-cli
  parallel:
    matrix:
      - PHP_VERSION: ["7.4", "8.3"]
  script:
    - find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

# WordPress coding standards and PHP 7.4+ compatibility.
phpcs:
  extends: .composer
  stage: test
  image: php:8.3-cli
  script:
    - composer phpcs

# Translations: the committed .pot must cover every string in the code, every
# string must have a Dutch translation, and the .mo must match the .po.
i18n:
  stage: test
  tags:
    - docker
  image: php:8.3-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq gettext > /dev/null
    - curl -sSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    - chmod +x /usr/local/bin/wp
  script:
    - wp i18n make-pot . /tmp/current.pot --exclude=vendor,docs --allow-root
    - msgcmp --use-untranslated languages/brew-log-for-brewfather.pot /tmp/current.pot
    - msgcmp languages/brew-log-for-brewfather-nl_NL.po /tmp/current.pot
    - msgfmt --check -o /tmp/nl_NL.mo languages/brew-log-for-brewfather-nl_NL.po
    - diff <(msgunfmt /tmp/nl_NL.mo) <(msgunfmt languages/brew-log-for-brewfather-nl_NL.mo)

# Unit tests (WordPress functions are stubbed in tests/bootstrap.php).
test:
  extends: .composer
  stage: test
  image: php:8.3-cli
  script:
    - composer test

# Publishes main and tags to the public GitHub repo, without CLAUDE.md and
# docs/ (see bin/publish-github.sh). Needs the masked, protected CI/CD
# variable GITHUB_TOKEN: a GitHub token with Contents read/write on the repo.
publish-github:
  stage: publish
  tags:
    - docker
  image: python:3.12-slim
  resource_group: github
  variables:
    GITHUB_REPO: github.com/richarddeweerd/brewfather-wp-plugin.git
  rules:
    - if: '$GITHUB_TOKEN && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG)'
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install -q git-filter-repo
  script:
    # The CI checkout is shallow; the script clones the full history itself.
    - bash bin/publish-github.sh "$CI_REPOSITORY_URL" "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_REPO}"
